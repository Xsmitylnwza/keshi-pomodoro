name: Desktop Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - "src/lib/authPort.ts"
      - "src/lib/timer/**"
      - "src/types/desktop.d.ts"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run icons
      - run: npm run check
      - run: npm test
      - name: Verify packaged runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Reject critical build-chain advisories
        shell: pwsh
        run: |
          npm audit --json 2>$null | Out-File -Encoding utf8 "$env:RUNNER_TEMP\audit.json"
          $audit = Get-Content "$env:RUNNER_TEMP\audit.json" -Raw | ConvertFrom-Json
          if ($audit.metadata.vulnerabilities.critical -gt 0) {
            throw "Critical build-chain vulnerability detected"
          }
      - run: npm run package

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    env:
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run icons
      - name: Match tag to package SemVer
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop package v$packageVersion"
          }
      - name: Materialize signing certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw "Windows signing secrets are required for a stable release"
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "keshi-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run make
      - name: Verify Authenticode and generate checksums
        shell: pwsh
        run: |
          $executables = @(
            Get-ChildItem -Path out -Recurse -File -Filter *.exe
          )
          if ($executables.Count -eq 0) {
            throw "No Windows executables were produced"
          }
          foreach ($file in $executables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature: $($file.FullName) ($($signature.Status))"
            }
          }
          $releaseDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
          $artifacts = Get-ChildItem -LiteralPath $releaseDirectory -File
          $checksums = foreach ($file in $artifacts) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          $checksums | Out-File -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS.txt") -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: keshi-pomodoro-${{ github.ref_name }}-windows
          path: desktop/out/make/squirrel.windows/x64/*
          if-no-files-found: error
      - name: Publish stable Squirrel release
        shell: pwsh
        run: |
          $releaseDirectory = Join-Path $PWD "out\make\squirrel.windows\x64"
          $files = Get-ChildItem -LiteralPath $releaseDirectory -File | ForEach-Object FullName
          gh release create "$env:GITHUB_REF_NAME" $files --verify-tag --title "Keshi Pomodoro $env:GITHUB_REF_NAME" --generate-notes
