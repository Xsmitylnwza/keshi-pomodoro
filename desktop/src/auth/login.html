<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Sign in to Keshi</title>
  <style>
    html { color-scheme: dark; }
    body { margin: 0; background: #0d0f0e; color: #f4f0e6; font: 16px system-ui; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: 100%; padding: 2.25rem; text-align: center; }
    .eyebrow { color: #a9c9a8; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .75rem 0; font-size: 1.65rem; }
    p { color: #c6cbc5; line-height: 1.55; }
    .code { margin: 1.5rem auto; border: 1px solid #4c544d; border-radius: 14px; padding: 1rem; font: 700 2rem ui-monospace; letter-spacing: .22em; color: #dcefd8; }
    .cancel { display: inline-block; margin-top: 1rem; border: 1px solid #555c56; border-radius: 999px; padding: .7rem 1.25rem; color: #f4f0e6; text-decoration: none; }
    .meta { font-size: .78rem; color: #858d86; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Keshi Pomodoro Desktop</p>
    <h1>Finish sign-in in your browser</h1>
    <p>Confirm that the matching code below appears in the secure Xsmity page.</p>
    <div class="code" id="code">------</div>
    <p class="meta" id="meta">This request expires in five minutes.</p>
    <a class="cancel" href="about:blank#cancel">Cancel</a>
  </main>
</body>
</html>
