<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Keshi Pomodoro architecture">
  <rect width="960" height="420" fill="#080808"/>
  <rect x="24" y="24" width="912" height="372" rx="12" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
  <text x="48" y="64" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Architecture</text>
  <text x="48" y="92" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Browser client · API server · SQLite discipline store · optional Hermes agent</text>

  <rect x="48" y="130" width="200" height="100" rx="10" fill="#111" stroke="#b91c1c" stroke-width="2"/>
  <text x="68" y="170" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">React Client</text>
  <text x="68" y="196" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">Timer · Themes · Discipline UI</text>

  <rect x="300" y="130" width="200" height="100" rx="10" fill="#111" stroke="#34d399" stroke-width="2"/>
  <text x="320" y="170" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Node API</text>
  <text x="320" y="196" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">server/pomodoro-server.mjs</text>

  <rect x="552" y="130" width="200" height="100" rx="10" fill="#111" stroke="#60a5fa" stroke-width="2"/>
  <text x="572" y="170" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SQLite + JSON</text>
  <text x="572" y="196" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">habits · scores · sessions</text>

  <rect x="804" y="130" width="120" height="100" rx="10" fill="#111" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="170" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Hermes</text>
  <text x="820" y="196" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="12">agent writes</text>

  <path d="M248 180 H300" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 180 H552" stroke="#6b7280" stroke-width="2"/>
  <path d="M752 180 H804" stroke="#6b7280" stroke-width="2"/>

  <rect x="48" y="270" width="864" height="90" rx="10" fill="#121212" stroke="#2a2a2a" stroke-width="2"/>
  <text x="68" y="310" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Deploy path</text>
  <text x="68" y="336" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Push main → GitHub Actions self-hosted runner → build + sync → restart pomodoro service → https://pomodoro.xsmity.cloud</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
