<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Discipline habit matrix concept">
  <rect width="960" height="360" fill="#080808"/>
  <rect x="24" y="24" width="912" height="312" rx="12" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="2"/>
  <text x="48" y="64" fill="#f2efe9" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Habit Completion Matrix</text>
  <text x="48" y="90" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Binary checks only — done (✓) or not done (·). Unique color per habit. Views: Grid · Lanes · Weeks · Rank</text>

  <!-- header -->
  <text x="80" y="140" fill="#9ca3af" font-family="Consolas, monospace" font-size="12">Day</text>
  <text x="180" y="140" fill="#fb7185" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Deep work</text>
  <text x="300" y="140" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Reading</text>
  <text x="420" y="140" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Exercise</text>
  <text x="540" y="140" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Sleep</text>
  <text x="660" y="140" fill="#a3e635" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Nutrition</text>
  <text x="800" y="140" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Discipline</text>

  <!-- rows -->
  <g font-family="Consolas, monospace" font-size="14" font-weight="700">
    <text x="70" y="185" fill="#d1d5db">Mon</text>
    <rect x="180" y="165" width="70" height="28" fill="#fb7185"/><text x="205" y="185" fill="#000">✓</text>
    <rect x="300" y="165" width="70" height="28" fill="none" stroke="#444"/><text x="328" y="185" fill="#777">·</text>
    <rect x="420" y="165" width="70" height="28" fill="#34d399"/><text x="445" y="185" fill="#000">✓</text>
    <rect x="540" y="165" width="70" height="28" fill="#38bdf8"/><text x="565" y="185" fill="#000">✓</text>
    <rect x="660" y="165" width="70" height="28" fill="none" stroke="#444"/><text x="688" y="185" fill="#777">·</text>
    <rect x="800" y="165" width="70" height="28" fill="#a78bfa"/><text x="825" y="185" fill="#000">✓</text>

    <text x="70" y="235" fill="#d1d5db">Tue</text>
    <rect x="180" y="215" width="70" height="28" fill="#fb7185"/><text x="205" y="235" fill="#000">✓</text>
    <rect x="300" y="215" width="70" height="28" fill="#fbbf24"/><text x="325" y="235" fill="#000">✓</text>
    <rect x="420" y="215" width="70" height="28" fill="none" stroke="#444"/><text x="448" y="235" fill="#777">·</text>
    <rect x="540" y="215" width="70" height="28" fill="#38bdf8"/><text x="565" y="235" fill="#000">✓</text>
    <rect x="660" y="215" width="70" height="28" fill="#a3e635"/><text x="685" y="235" fill="#000">✓</text>
    <rect x="800" y="215" width="70" height="28" fill="#a78bfa"/><text x="825" y="235" fill="#000">✓</text>

    <text x="70" y="285" fill="#d1d5db">Wed</text>
    <rect x="180" y="265" width="70" height="28" fill="none" stroke="#444"/><text x="208" y="285" fill="#777">·</text>
    <rect x="300" y="265" width="70" height="28" fill="#fbbf24"/><text x="325" y="285" fill="#000">✓</text>
    <rect x="420" y="265" width="70" height="28" fill="#34d399"/><text x="445" y="285" fill="#000">✓</text>
    <rect x="540" y="265" width="70" height="28" fill="none" stroke="#444"/><text x="568" y="285" fill="#777">·</text>
    <rect x="660" y="265" width="70" height="28" fill="#a3e635"/><text x="685" y="285" fill="#000">✓</text>
    <rect x="800" y="265" width="70" height="28" fill="none" stroke="#444"/><text x="828" y="285" fill="#777">·</text>
  </g>

  <text x="48" y="325" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="12">Color alone is never the only signal — every cell dual-encodes with ✓ / · for accessibility.</text>
</svg>
